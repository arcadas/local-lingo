[project]
name = "local-lingo"
version = "0.1.0"
description = "Private local proofreader and translator web app powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.47.2,<6.0",
    "openai>=1.109.1",
]

[project.scripts]
local-lingo = "local_lingo.app:main"
local-lingo-cli = "local_lingo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
